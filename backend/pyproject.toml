[project]
name = "hr-platform"
version = "1.2.0"
description = "HR 智能工作台 — 企业协作门户基础平台"
readme = { file = "../README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://github.com/Keyou430/HR"
Repository = "https://github.com/Keyou430/HR"
Issues = "https://github.com/Keyou430/HR/issues"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "N818",  # exception-name-uppercase — project convention
]

[tool.ruff.lint.isort]
known-first-party = ["store", "auth", "audit", "ai_security", "routers", "stores"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: 核心冒烟测试 — 1 分钟内跑完",
    "slow:  慢速测试 — 含网络调用或大数据量",
]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "__pycache__", ".pytest_cache", "alembic"]
skips = ["B101", "B311"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/test_*.py",
    "*/conftest.py",
    "*/alembic/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
