# HR Platform — Production Compose
# Usage: docker compose -f docker/compose.yml up -d

services:
  postgres:
    extends:
      file: compose.base.yml
      service: postgres

  api:
    extends:
      file: compose.base.yml
      service: api
    volumes:
      - frontend-dist:/app/static
      - backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Running Alembic migrations..."
        alembic upgrade head
        echo "Bootstrapping admin user..."
        /app/scripts/init-admin.sh
        echo "Starting API server..."
        exec uvicorn main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - hr-net

  pgbackup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-hr_platform}
      PGUSER: ${POSTGRES_USER:-hr_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hr_password}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Backup service started (interval: 6h)"
        sleep 60
        while true; do
          echo "=== Backup started at $$(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          /backup.sh
          echo "=== Backup finished, sleeping 6h ==="
          sleep 21600
        done
    networks:
      - hr-net

volumes:
  pgdata:
  frontend-dist:
  backups:

networks:
  hr-net:
    driver: bridge
